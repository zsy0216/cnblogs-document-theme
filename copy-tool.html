<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>博客园主题 · 一键复制</title>
<style>
  :root { --a:#d05ce8; --ink:#111827; --body:#4b5563; --line:#e8eaee; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px;
    font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: var(--body);
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 22px; color: var(--ink); }
  p.sub { margin: 0 0 26px; font-size: 13px; color: #8b93a1; }
  .step {
    display: flex; gap: 14px; align-items: flex-start;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(17,24,39,.04);
  }
  .no {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    background: #f3e8fd; color: var(--a); font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .body { flex: 1; min-width: 0; }
  .t { font-weight: 600; color: var(--ink); font-size: 14px; }
  .d { font-size: 12.5px; color: #8b93a1; margin-top: 2px; }
  .d code { background: #f5f6f8; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  button {
    margin-top: 10px; border: 0; cursor: pointer;
    background: var(--a); color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 18px; border-radius: 8px;
    transition: background .15s ease;
  }
  button:hover { background: #c04cd8; }
  button.done { background: #16a34a; }
  .hint {
    margin-top: 22px; padding: 12px 16px;
    background: #fff8e6; border: 1px solid #f5e0b0; border-radius: 10px;
    font-size: 12.5px; color: #8a6d1f;
  }
  #st { margin-top: 16px; font-size: 13px; color: var(--a); min-height: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>博客园主题 · 一键复制</h1>
  <p class="sub">先点按钮复制，再到后台对应输入框里 Ctrl+A 全选、Ctrl+V 粘贴。三个都粘完后点页面底部的「保存」。</p>

  <div class="step">
    <div class="no">1</div>
    <div class="body">
      <div class="t">页面定制 CSS 代码</div>
      <div class="d">后台位置：设置 → 页面定制CSS代码</div>
      <button data-path="/css/theme-v6.css" data-label="CSS">复制 CSS</button>
    </div>
  </div>

  <div class="step">
    <div class="no">2</div>
    <div class="body">
      <div class="t">页首 HTML 代码</div>
      <div class="d">后台位置：设置 → 页首HTML代码（顶栏结构）</div>
      <button data-path="/snippets/head-nav-v6.html" data-label="顶栏">复制页首 HTML</button>
    </div>
  </div>

  <div class="step">
    <div class="no">3</div>
    <div class="body">
      <div class="t">页脚 HTML 代码</div>
      <div class="d">后台位置：设置 → 页脚HTML代码（原 awescnb 脚本会被整体替换）</div>
      <button data-path="/snippets/footer-script-v6.html" data-label="页脚">复制页脚 HTML</button>
    </div>
  </div>

  <div class="hint">
    提示：三个输入框都要 <b>先 Ctrl+A 全选再粘贴</b>，避免旧内容残留（尤其页脚里的 awescnb）。
    粘完后滚到页面底部点「保存」，成功则不再出现「不是有效的 HTML」提示。
  </div>

  <div id="st"></div>
</div>

<script>
(function () {
  var st = document.getElementById('st');
  document.querySelectorAll('button[data-path]').forEach(function (btn) {
    btn.addEventListener('click', async function () {
      var old = btn.textContent;
      btn.disabled = true;
      try {
        var r = await fetch(btn.dataset.path, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var t = await r.text();
        await navigator.clipboard.writeText(t);
        btn.textContent = '已复制 ' + t.length + ' 字符';
        btn.classList.add('done');
        st.textContent = btn.dataset.label + ' 已复制到剪贴板，去后台粘贴吧';
        setTimeout(function () {
          btn.textContent = old;
          btn.classList.remove('done');
          btn.disabled = false;
        }, 2500);
      } catch (e) {
        st.textContent = '复制失败：' + e.message + '（可改用下面链接直接打开文件）';
        btn.disabled = false;
      }
    });
  });
})();
</script>
</body>
</html>
