      var sec = mk('section', 'qb-arc-mo' + (mo.key === curKey ? ' qb-arc-cur' : ''));
      sec.id = 'qb-arc-' + mo.key;

      var hd = mk('div', 'qb-arc-mhd');
      var name = mk('a', 'qb-arc-mname', mo.m + ' 月');
      name.href = mo.url;
      name.title = '打开 ' + mo.y + ' 年 ' + mo.m + ' 月的归档页';
      hd.appendChild(name);
      hd.appendChild(mk('span', 'qb-arc-mcount', mo.n + ' 篇'));
      hd.appendChild(mk('span', 'qb-arc-mline'));
      sec.appendChild(hd);

      var ul = mk('ul', 'qb-arc-list');
      /* 占位而非「加载中」：滚动到附近才会真的发起请求。
         同时按篇数预估高度 —— 否则未加载的月份只有一行高，十几个月份会全挤进首屏，
         IntersectionObserver 一次性把所有请求都点亮，懒加载就白做了 */
      ul.style.minHeight = (mo.n * 30 + 6) + 'px';
      ul.appendChild(mk('li', 'qb-arc-tip qb-arc-pend', '· · ·'));
      sec.appendChild(ul);
      box.appendChild(sec);
      map[mo.key] = ul;
    });
    return map;
  }

  function fillArchiveMonth(ul, mo, items) {
    ul.innerHTML = '';
    ul.style.minHeight = '';
    if (!items || !items.length) {
      var li0 = mk('li', 'qb-arc-tip');
      var a0 = mk('a', 'qb-arc-jump', '打开该月 · ' + mo.n + ' 篇 ↗');
      a0.href = mo.url;
      li0.appendChild(a0);
      ul.appendChild(li0);
      return;
    }
    items.forEach(function (it) {
      var li = mk('li', 'qb-arc-item');
      var a = mk('a', 'qb-arc-link');
      a.href = it.u;
      a.title = it.d + (it.hm ? ' ' + it.hm : '') + ' · ' + it.t;
      a.appendChild(mk('span', 'qb-arc-d', it.d.slice(5) + (it.hm ? ' ' + it.hm : '')));
      a.appendChild(mk('span', 'qb-arc-t', it.t));
      if (it.r) a.appendChild(mk('span', 'qb-arc-r', String(it.r)));
      li.appendChild(a);
      ul.appendChild(li);
    });
    /* 抓到的比侧栏说的少 —— 不装作完整：把差额和入口一起摆出来 */
    if (mo.n && items.length < mo.n) {
      var miss = mk('li', 'qb-arc-tip');
      var am = mk('a', 'qb-arc-jump',
        '另有 ' + (mo.n - items.length) + ' 篇未取到 · 打开该月 ↗');
      am.href = mo.url;
      miss.appendChild(am);
      ul.appendChild(miss);
    }
  }

  /* 左栏：年份 + 月份胶囊索引，点一下滚到对应月份（只用月份索引数据，不等抓取）。
     onJump(key) 用于「目标月还没加载」时先发起请求，否则会滚到一片「· · ·」 */
  function renderArchiveIndex(panel, months, curKey, onJump) {
    var total = 0, years = [];
    months.forEach(function (mo) {
      total += mo.n;
      var y = years[years.length - 1];
      if (!y || y.y !== mo.y) { y = { y: mo.y, ms: [] }; years.push(y); }
      y.ms.push(mo);
    });
    var cnt = panel.querySelector('.qb-count');
    if (cnt) cnt.textContent = total + ' 篇';

    var wrap = mk('div', 'qb-arc-idx');
    years.forEach(function (y) {
      var row = mk('div', 'qb-arc-idx-row');
      row.appendChild(mk('span', 'qb-arc-idx-y', String(y.y)));
      var ms = mk('div', 'qb-arc-idx-ms');
      y.ms.forEach(function (mo) {
        var a = mk('a', 'qb-arc-idx-m' + (mo.key === curKey ? ' on' : ''));
        a.href = '#qb-arc-' + mo.key;
        a.setAttribute('data-t', 'qb-arc-' + mo.key);
        a.setAttribute('data-key', mo.key);
        a.title = mo.y + ' 年 ' + mo.m + ' 月 · ' + mo.n + ' 篇';
        a.appendChild(document.createTextNode(mo.m + '月'));
        a.appendChild(mk('i', 'qb-arc-idx-n', String(mo.n)));
        ms.appendChild(a);
      });
      row.appendChild(ms);
      wrap.appendChild(row);
    });
    panel.appendChild(wrap);

    wrap.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      var t = document.getElementById(a.getAttribute('data-t'));
      if (!t) return;
      e.preventDefault();
      /* 高亮跟着点击走（默认是最新月），不然点完还亮着最新月会很怪 */
      [].forEach.call(wrap.querySelectorAll('.qb-arc-idx-m'), function (x) { x.classList.remove('on'); });
      a.classList.add('on');
      if (onJump) onJump(a.getAttribute('data-key'));
      window.scrollTo({
        top: t.getBoundingClientRect().top + window.pageYOffset - 72,
        behavior: 'smooth'
      });
      history.replaceState(null, '', a.getAttribute('href'));
    });
  }

  /* 地址与标题消歧：博客园只提供 /p/archive/YYYY/MM 这种「某月」地址，没有归档总览路由
     （/p/archive、/p/archive.html、/p/archive/all 实测全是 404，且 404 页不注入用户脚本）。
     所以地址栏那个月份只是「入口」，内容永远是全部归档。做法是统一replaceState 到
     「最新月 + ?view=all」：既是真实存在的页面（刷新、分享都 200），又不再出现
     2021/07 这种会误导人的历史月份。 */
  function normalizeArchiveUrl(months) {
    var latest = months && months[0];
    if (!latest) return;
    try {
      var u = new URL(latest.url, location.href);
      u.search = '?view=all';
      u.hash = '';
      if (u.pathname + u.search !== location.pathname + location.search) {
        history.replaceState(null, '', u.pathname + u.search);
      }
    } catch (e) { /* 老浏览器不支持 URL，地址保持原样，不影响内容 */ }

    var site = (document.querySelector('.qb-brand-text') || {}).textContent || '';
    site = site.replace(/\s+/g, ' ').trim();
    if (site) document.title = '全部归档 - ' + site;
  }

  /* 归档页的月份索引来自侧栏「随笔档案」，而那个小部件是**异步注入**的：
     页脚脚本先执行、小部件后到，是常态而不是异常。
     早先的写法是一读不到月份就 return false，直接回退成博客园的单月列表 ——
     于是同一个页面刷几次会时好时坏（表现就是「重复进几次又变回去」）。
     现在改成：读不到就挂起轮询等待，12 秒还读不到才认命回退。 */
  var ARC_WAITING = 0;

  /* 条件补齐后重建（也用于「已经回退过、后来又读到月份」的自愈） */
  function retryFullArchive(left) {
    if (!CFG.archive) return false;
    if (!left || document.querySelector('.qb-archive')) return false;
    if (!/\/p\/archive\/\d{4}\/\d{1,2}/.test(location.pathname)) return false;
    if (readArchiveMonths().length < 2) return false;
    if (!document.querySelector('#mainContent .entrylist')) return false;
    /* 可能已经被 buildPostList 占了左栏，先清掉脚本自己建的面板再重建 */
    [].forEach.call(left.querySelectorAll('.qb-panel'), function (p) {
      if (p.parentNode) p.parentNode.removeChild(p);
    });
    buildFullArchive(left);
    return !!document.querySelector('.qb-archive');
  }

  function waitArchiveReady(left) {
    if (ARC_WAITING) return 'wait';
    ARC_WAITING = 1;

    /* 等待期先给左栏一个占位，否则会短暂出现「左栏空白 + 正文只有 4 篇」，
       看起来就像主题没生效 */
    if (!left.querySelector('.qb-panel')) {
      var ph = makePanel('全部归档', '读取中');
      ph.appendChild(mk('div', 'qb-arc-wait', '正在读取月份索引…'));
      left.insertBefore(ph, left.firstChild);
    }

    var tries = 0, timer = null, mo = null;

    function isReady() {
      return !!(document.querySelector('#mainContent .entrylist') && readArchiveMonths().length >= 2);
    }
    function stop() {
      if (timer) { clearInterval(timer); timer = null; }
      if (mo) { mo.disconnect(); mo = null; }
      ARC_WAITING = 0;
    }
    /* 返回 true = 处理完毕（建成时间线，或已存在），可以停止观察 */
    function done() {
      if (document.querySelector('.qb-archive')) { stop(); return true; }
      if (!isReady()) return false;
      stop();
      retryFullArchive(left);
      syncArchiveNav();
      return true;
    }

    /* 月份索引来自博客园侧栏 XHR（#sidebar_postarchive）。原来只靠 200ms 轮询，
       平均要多等半个周期；归档页的原生列表又被预隐藏了，这多等的 100~180ms 全都
       体现在"页面停着不动"。用观察器在节点插入的那一刻（微任务）就判断，能提前一拍。 */
    if ('MutationObserver' in window) {
      mo = new MutationObserver(function () { done(); });
      mo.observe(document.documentElement, { childList: true, subtree: true });
    }

    timer = setInterval(function () {
      tries += 1;
      if (done()) return;
      if (tries >= 60) {   /* 约 12 秒：确实没有月份索引，回退成博客园单月列表 */
        stop();
        if (document.querySelector('.qb-archive')) return;
        [].forEach.call(left.querySelectorAll('.qb-panel'), function (p) {
          if (p.parentNode) p.parentNode.removeChild(p);
        });
        buildPostList(left);
      }
    }, 200);
    return 'wait';
  }

  function buildFullArchive(left) {
    if (!/\/p\/archive\/\d{4}\/\d{1,2}/.test(location.pathname)) return false;
    /* 幂等：页脚 HTML 万一贴了两遍、或脚本被重复执行，不要在页面上再叠一份时间线 */
    if (document.querySelector('.qb-archive')) return true;
    var entry = document.querySelector('#mainContent .entrylist');
    var months = readArchiveMonths();
    /* 正文容器或月份索引还没就绪 —— 是「还没到」，不是「不可用」，挂起等待 */
    if (!entry || !months.length) return waitArchiveReady(left);
    if (months.length < 2) return false;

    /* 默认高亮最新月，与规范化后的地址保持一致。
       如果按地址里的月份高亮，会出现「首次从 2021/07 进来亮 7 月、刷新后地址变
       2026/11 又亮 11 月」的跳变；这里统一到最新月，点左栏索引时再跟随点击移动 */
    var curKey = months[0].key;
    var total = 0;
    months.forEach(function (mo) { total += mo.n; });

    /* 正式面板进来之前先摘掉等待期的占位面板。
       waitArchiveReady 建的那张只写了「读取中」，不清掉就会和这张并排，
       左栏出现两张「全部归档」—— 何时出现取决于月份索引来得快慢，所以是偶发。 */
    var staleWait = left.querySelector('.qb-arc-wait');
    if (staleWait) {
      var stalePanel = staleWait.closest ? staleWait.closest('.qb-panel') : null;
      (stalePanel || staleWait).parentNode.removeChild(stalePanel || staleWait);
    }

    var panel = makePanel('全部归档', total + ' 篇');
    left.insertBefore(panel, left.firstChild);

    var box = mk('div', 'qb-archive');
    var hd = mk('div', 'qb-arc-hd');
    hd.appendChild(mk('span', 'qb-arc-title', '全部归档'));
    hd.appendChild(mk('span', 'qb-arc-meta',
      total + ' 篇 · ' + months.length + ' 个月 · ' +
      months[months.length - 1].key + ' → ' + months[0].key));
    box.appendChild(hd);
    var bodyBox = mk('div', 'qb-arc-body');
    box.appendChild(bodyBox);
    entry.parentNode.insertBefore(box, entry);
    entry.style.display = 'none';

    var map = buildArchiveShell(bodyBox, months, curKey);
    var byKey = {}, state = {};
    months.forEach(function (mo) { byKey[mo.key] = mo; });
    var enqueue = arcQueue(4);

    /* 逐月加载：同一个月份只抓一次，成败都记账，滚动来回不会重复请求 */
    function loadMonth(key) {
      var mo = byKey[key];
      if (!mo || state[key]) return;
      state[key] = 'load';
      var ul = map[key];
      if (ul) { ul.innerHTML = ''; ul.appendChild(mk('li', 'qb-arc-tip', '加载中…')); }
      enqueue(function () { return fetchArchiveMonth(mo); }, function (items) {
        state[key] = 'ok';
        fillArchiveMonth(ul, mo, items);
      }, function () {
        /* 抓不到（扩展拦截、代理、CSP）就给「打开该月」入口，不留空白、不无限转圈；
           不记成已失败，下次点左栏索引还能再试一次 */
        delete state[key];
        fillArchiveMonth(ul, mo, null);
      });
    }

    /* 只抓「快滚到的月份」：首屏 3~5 个请求，滚下去再按月补。
       没有 IntersectionObserver 的老浏览器直接全量，行为与旧版一致 */
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) {
          if (!en.isIntersecting) return;
          var k = en.target.getAttribute('data-arc-key');
          if (!k) return;
          io.unobserve(en.target);
          loadMonth(k);
        });
      }, { rootMargin: '600px 0px' });
      months.forEach(function (mo) {
        var sec = document.getElementById('qb-arc-' + mo.key);
        if (!sec) return;
        sec.setAttribute('data-arc-key', mo.key);
        io.observe(sec);
      });
    } else {
      months.forEach(function (mo) { loadMonth(mo.key); });
    }

    /* 左栏索引在 buildArchiveShell 之后才追加，点击时先补数据再滚动 */
    renderArchiveIndex(panel, months, curKey, loadMonth);
    clearArcCacheOld();
    normalizeArchiveUrl(months);
    return true;
  }

  /* 5.8 顶栏「归档」跟随最新月份：博客园只有按月归档，写死某个月就永远停在那儿 */
  function syncArchiveNav() {
    var link = document.querySelector('.qb-nav a[href*="/p/archive/"]');
    if (!link) return;
    var months = readArchiveMonths();
    if (!months.length) return;
    link.href = months[0].url;
    /* 归档页地址形如 /用户名/p/archive/2019/12，跟任何顶栏链接都对不上，
       markNav() 会漏掉高亮，这里补上 */
    if (location.pathname.indexOf('/p/archive/') > -1) link.classList.add('on');
  }

  /* 页首若放了 loading 遮罩（合并托管版推荐放，见 snippets/loading-v7.html），
     样式与结构到位后淡出。内联版没放遮罩时这里直接返回，无副作用。 */
  function dropLoading() {
    var l = document.getElementById('loading');
    if (!l) return;
    l.style.transition = 'opacity .3s';
    l.style.opacity = '0';
    setTimeout(function () {
      if (l.parentNode) l.parentNode.removeChild(l);
    }, 350);
  }

  /* ============ 6.9 就绪闸门与侧栏同步 ============
     侧栏相关加工集中到 syncSide()：首次 boot、侧栏节点到达、低频兜底轮询都调它。
     每一步都是幂等的（建过就跳过），多调几次没有副作用，所以不必担心重复。 */
  function syncSide(left) {
    splitDayGroups();
    if (CFG.pager) enhancePager();
    moveSideWidgets();
    watchSideColumn();
    renderNotice();
    /* 侧栏比脚本晚到时补建归档；已经回退过也能在这里自愈。
       syncArchiveNav 一起补：否则顶栏「归档」还停在该死的旧月份上 */
    retryFullArchive(left);
    syncArchiveNav();
  }

  /* 结构够不够开工：必须等 #sideBarMain 解析出来。
     只等 #mainContent 会放行得太早 —— DOM 顺序是「正文 → 侧栏」，#mainContent 一出现
     就开始建左栏，buildLeft 返回 true，settle 立刻松闸，而 #sideBar 还差几 KB 没解析。
     实测：773ms 放行时 #sideBarMain 还是 null，825ms 右栏才出现 —— 用户看到的就是
     「页面出来了，右边空着，50ms 后补上一整列」。
     #sideBarMain 是右栏容器，等它才算真的齐。博客园后台把侧栏全关掉时它不存在，
     由 settle 的帧上限兜底。 */
  function sideReady() {
    /* 等 #leftcontentcontainer，而不是它的祖先 #sideBar / #sideBarMain ——
       祖先的开放标签一出现 getElementById 就能拿到，那时子节点还差几 KB 没解析。
       #leftcontentcontainer 是 #sideBarMain 的最后一个子节点，它出现 = 右栏整段解析完。 */
    return !!(document.getElementById('main') &&
              document.getElementById('mainContent') &&
              document.getElementById('leftcontentcontainer'));
  }

  /* 左栏容器：脚本自建，插在 #mainContent 之前。
     绝不能借用 #leftcontentcontainer —— 那个名字带 left，里面装的却是右栏那叠卡，
     借用它会逼着脚本把卡片再搬一次，搬运就是抖动的来源。
     grid 用显式列位，DOM 顺序只影响 Tab 键顺序。 */
  function leftBox() {
    var box = document.getElementById('qb-left');
    if (box) return box;
    var main = document.getElementById('main');
    if (!main) return null;
    box = mk('div', 'qb-left');
    box.id = 'qb-left';
    var mc = document.getElementById('mainContent');
    if (mc && mc.parentNode === main) main.insertBefore(box, mc);
    else main.insertBefore(box, main.firstChild);
    return box;
  }

  var unlocked = false;
  /* 闸门是否还压着。只有 settle 判定「可以显示」时才松开。
     不能让别人随便调 unlock()：DOMContentLoaded 和 load 都比右栏那叠卡
     （博客园 JS 动态插入的 #blog-sidecolumn）早 100ms 以上，无条件放行就等于
     把「页面先出现、右栏后长出来」放回来 —— 那正是用户说的"抖一下"。 */
  var gateHold = true;
  /* 解锁首帧闸门（css 里的 html:not(.qb-ready) body）。只允许一次。
     用 classList 而不是 className +=：bundle 的样式注入段也在同一个 <html> 上操作，
     拼字符串会写出 "qb-ready qb-ready" 这种重复类名。 */
  function unlock(force) {
    if (unlocked || !document.documentElement) return;
    if (gateHold && !force) return;
    unlocked = true;
    var de = document.documentElement;
    /* 归档页若最终没建出时间线（只有一个月、月份索引一直没到），把预隐藏解开。
       否则原生按月列表要等 CSS 里那 3 秒兜底才出现，正文会一直空着 —— 比闪更糟。 */
    if (de.className.indexOf('qb-arc-page') >= 0 && !document.querySelector('.qb-archive')) {
      de.className = de.className.replace(/\s*qb-arc-page\b/, '');
    }
    if (de.classList) de.classList.add('qb-ready');
    else de.className += ' qb-ready';
  }

  /* 左栏一次建成，返回 false 表示「正文还没解析够」。
     分块传输时 #cnblogs_post_body 的开放标签先到、标题后到；如果这时就退回
     「文章列表」，详情页会先出现一块错误的列表、随后又跳成目录 —— 就是那一跳。
     所以标题不足时宁可等下一帧，也不要急着 fallback。 */
  var leftDone = false;
  function buildLeft() {
    if (leftDone) return true;
    var left = leftBox();
    if (!left) return false;
    var body = document.getElementById('cnblogs_post_body');
    if (body) {
      if (body.querySelectorAll('h1, h2, h3, h4').length < 2 &&
          document.readyState === 'loading') return false;
      if (buildToc(body, left)) { leftDone = true; return true; }
    }
    if (CFG.archive && buildFullArchive(left)) { leftDone = true; return true; }
    if (buildPostList(left)) { leftDone = true; return true; }
    return false;
  }

  /* 逐帧等结构齐（最多 12 帧 ≈ 200ms），齐了立即解锁首帧闸门。
     闸门挡着绘制，所以这几帧用户看不到任何东西；一旦齐了整页一次出现。
     超时或解析结束后无条件解锁，保证不会停留白屏。 */
  function settle(left, n) {
    var ok = sideReady() && buildLeft();
    if (ok) syncSide(left);

    var de = document.documentElement;
    var readyToShow = ok || n >= 12 || document.readyState !== 'loading';

    /* 到了该放行的时候，但还有两样东西在路上，就再等一两帧：
       ① 右栏那十张卡（分类/归档/标签/搜索/最新评论）是博客园 XHR 填的，
          实测比结构就位晚约 100ms。不等它，页面会先出现、100ms 后右栏忽然长出一块。
       ② 归档页的时间线没建好前不能放行：原生按月列表已被 qb-arc-page 藏住，
          提前放出去只能是「空正文」或「原生列表」，两种之后都要再跳一次。
       上限不同：侧栏卡约 100ms 就到，给 30 帧（500ms）足够；归档时间线要等月份
       索引 XHR，实测 300~400ms，给 60 帧（1 秒）才稳。有些页面在博客园后台关掉了
       这些侧栏部件，容器永远为空，所以不能用同一个上限死等；
       unlock 里会顺手解开归档页的预隐藏，退回原生列表。 */
    /* 归档页要等到「时间线壳 + 第一个月的条目」都在位才能放行。
       只判 .qb-archive 存在不够：壳是同步插的，里面每个月的文章是异步 XHR 填的，
       实测壳 600ms 就在、条目 750ms 才齐 —— 中间那一秒用户看到的是骨架和「加载中…」，
       然后内容一路填进来，观感就是归档页在闪。 */
    var arcBox = document.querySelector('.qb-archive');
    var arcPending = de.className.indexOf('qb-arc-page') >= 0 &&
                     (!arcBox || !arcBox.querySelector('li:not(.qb-arc-tip)'));
    /* 右栏那叠卡仍要等。它不影响正文与左栏的位置（三栏各占各的列），
       但它决定右栏自己的高度：不等它，放行时右栏是 0 高的一片空白，
       用户看着卡片一张张填进来 —— 这就是「右栏内容晚到」的观感。
       容器可能整个不存在（后台关掉了全部侧栏部件），所以用帧上限兜底。 */
    var col = document.getElementById('blog-sidecolumn');
    var colPending = !col || !col.children.length;
    /* 分类名单（列表页的筛选条 / 详情页的分类胶囊）也是一次同源请求。
       只在缓存过期后的第一次访问会挂起，命中缓存是同步的，不会走到这里。
       上限 30 帧（约 500ms）：网络慢就放行，宁可这次少一条分类条，不能让页面干等。 */
    if ((arcPending && n < 60) || (colPending && n < 30) || (TAXO.pending && n < 30)) {
      requestAnimationFrame(function () { settle(left, n + 1); });
      return;
    }

    if (readyToShow) {
      /* 到这里就是「该显示而且没有 pending」或「已经等到上限」——松闸 */
      gateHold = false;
      unlock();
      return;
    }
    requestAnimationFrame(function () { settle(left, n + 1); });
  }

  function boot() {
    /* 顶栏吸顶修复：必须最先做，否则后续按视口测量的位置全是错的 */
    hoistNav();

    /* 先把「同日多篇」拆成一篇一卡，再建目录（目录要按拆完的顺序取文章） */
    splitDayGroups();
    if (CFG.pager) enhancePager();

    buildLeft();
    var left = document.getElementById('qb-left');
    syncSide(left);

    lazyImages();
    /* 代码块放在闸门放行前：行号要在首帧就是齐的，晚一步会看到代码先铺开、行号后插入 */
    if (CFG.code) enhanceCode();
    /* 表格容器与 Markdown 补全也要在放行前做完：晚一步会看到表格先按 7 列挤成竖条、
       再「哗」地展开成可横滑 —— 那一下比一开始就能滑更难看 */
    enhanceTables();
    enhanceMarkdown();
    /* 阅读时长 / 锚点 / 版权同样要在放行前做完，否则会看到正文先出现、
       版权块随后「长出来」。放在 buildLeft 之后：目录可能已经给标题写过 id，直接复用。 */
    enhancePost();
    /* 分类与标签：详情页标题下胶囊 + 列表页顶部分类条。
       缓存命中时同步画完；未命中先按 keywords 末位占位、名单到位再复核。
       TAXO.pending 会被 settle 读到，首访宁可多等一百毫秒，也不让分类条后长出来。 */
    initTaxonomy();
    /* 目录抽屉依赖 buildLeft 的产物，必须排在它后面 */
    initMobileToc();
    /* 导航抽屉要克隆 .qb-links 的 a，必须排在 markNav 之后 ——
       否则克隆出来的是还没打上 .on 的那份，抽屉里当前页不会高亮 */
    markNav();
    initMobileMenu();
    initFavicon();
    initDarkMode();
    initTheme();
    /* 页脚署名：包内脚本可能早于 #footer 解析，DCL 那次会补上，内部幂等 */
    initCredit();
    if (CFG.backToTop) createBackToTop();
    /* 续读放在最后：它要在 load 之后才滚，早调晚调不影响首帧 */
    initResume();

    /* 结构齐了才解锁首帧闸门；没齐就逐帧补，最多 12 帧后无条件解锁 */
    settle(left, 0);

    /* 兜底轮询：博客园侧栏里还有异步追加的节点（排行榜、积分、最新评论），
       它们到位后可能重排，隔 500ms 复位一次共 12 次（6 秒），之后不再打扰。
       注意它不负责「首次建右栏」—— 那已由 waitSide 负责，所以不会再有半秒空窗。 */
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      syncSide(left);
      if (tries > 12) clearInterval(timer);
    }, 500);

    dropLoading();
  }

  /* 顶栏在解析期就渲染：包内样式先于本脚本注入，所以首帧画出来就是带样式的顶栏。
     A 内联方案（CSS 在「页面定制 CSS 代码」、脚本在页脚）也能用，只是顶栏会晚一拍。 */
  if (document.body) renderNav();
  /* 暗色必须在第一次绘制之前就应用：闸门期间画出来的是页面底色，
     晚一步的话暗色用户会先看到一帧亮底再变黑 —— 那一下白就是这个。 */
  syncDarkClass(darkPref());
  /* 主题色同理：晚一步就会看到强调色先紫一下再变蓝。
     必须在 CFG.accent 那个 style 之后执行，后插入的同名变量才压得住它。 */
  applyTheme(themePref());
  /* 关掉闸门时立刻解锁：页面从解析起就可见，和 6.x 一样边解析边显示 */
  /* gate:false = 明确要求「边解析边显示」（内联版的默认值），这时不解锁没意义 */
  if (CFG.gate === false) { gateHold = false; unlock(); }
  window.__QB_READY__ = true;

  /* ============ 7. 启动时机：抢在首帧之前 ============
     页首用 document.write 同步加载本文件时，执行点在 <body> 最前面 —— 此时 #main 还
     没解析出来，等 DOMContentLoaded 就太晚了：首帧早就画完，目录 / 侧栏 / 公告会在
     200ms 后"啪"地出现，观感就是切页闪一下（v7.3 实测：首帧 344ms，侧栏 792ms）。
     MutationObserver 在解析器每次插入节点后以微任务触发，比下一帧还早，所以一看到
     #mainContent 出现就 boot，整套 DOM 加工能在样式表到齐、首帧渲染之前完成。
     A 方案（脚本放页脚）执行时 DOM 已完整，第一次判断就能直接 boot。 */
  var booted = false;
  function bootOnce() {
    if (booted) return true;
    if (!document.getElementById('mainContent')) return false;
    /* 页面还在解析、侧栏节点未到时先不 boot：那一刻正文子节点也不全，
       建出来的目录会缺章节，只能等后面补建 —— 而补建就是"跳一下"。
       闸门挡着绘制，boot 晚几十毫秒没有视觉代价，换来一次建成。 */
    if (document.readyState === 'loading' && !sideReady()) return false;
    booted = true;
    boot();
    return true;
  }

  if (!bootOnce()) {
    var mo = new MutationObserver(function () {
      if (bootOnce()) mo.disconnect();
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', function () {
      if (bootOnce()) mo.disconnect();
    });
    /* 兜底：极端情况（脚本在 head 执行、观察器被摘掉）也不会永远不初始化 */
    setTimeout(function () { bootOnce(); mo.disconnect(); }, 1500);
  }

  /* 补一次内容构建：网络慢 / 分块传输时早期 boot 可能空手而归。
     DCL 时若左栏仍然空着就再建一次；已经有面板说明建过了，直接跳过。
     注意这里不能直接 unlock()：DCL 通常比右栏那叠卡（博客园 XHR）早 200ms，
     无条件放行就把「页面先出现、右栏后长出来」的老问题又带回来了。
     交给 settle 判断，它会在 pending 结束或到达上限时放行。 */
  document.addEventListener('DOMContentLoaded', function () {
    if (!booted) return;
    if (!leftDone) buildLeft();
    /* 正文后到时补一次。下面每一步都带「已存在就跳过」的判据，重复调用安全 */
    enhanceTables();
    enhanceMarkdown();
    enhancePost();
    /* 分类条 / 标签胶囊同样带「已存在则复用」判据，重复调用安全 */
    initTaxonomy();
    /* #footer 那时可能还没解析到，这里补一次；已有 .qb-credit 就直接返回 */
    initCredit();
    initMobileToc();
    initMobileMenu();
    var lc = document.getElementById('qb-left');
    syncSide(lc);
    settle(lc, 12);
  });

  /* 闸门兜底：boot 因为结构异常没跑起来时，这里补跑一次（而不是直接 unlock）。
     直接 unlock 会绕过 settle 的等待条件，等于把「右栏后长出来」放回来。
     load 时再无条件解锁一次，作为最后一道保险 —— 那时图片/脚本都到齐了。 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { bootOnce(); });
  } else {
    bootOnce();
  }
  /* load 只补跑 boot，不直接解锁：load 实测比 #blog-sidecolumn 出现还早，
     在这里放行等于白等。真要保底，交给下面那 1.2 秒。 */
  window.addEventListener('load', function () { bootOnce(); });

  /* 绝对兜底：1.5 秒后不管什么原因还没放行，强制显示 ——
     宁可右栏晚一点，也不能让页面停在不可见状态。
     实测最慢的页面（首页冷启动）到 1.13s 才齐，所以留到 1.5s；
     CSS 里另有一条 2.5 秒的纯 CSS 兜底，专门用于脚本完全没跑起来的情况。 */
  setTimeout(function () { unlock(true); }, 1500);
})();
</script>
