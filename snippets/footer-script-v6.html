<!-- 主题 v6.0 页脚 HTML 重要脚本
     位置：博客园后台 -> 设置 -> 页脚 HTML 代码
     说明：1. 这里的 script 包含全部 DOM 操作逻辑（目录生成、滚动高亮、部件搬运）。2. 粘贴前务必备份原有内容。3. 博客园 HTML 校验器：确保没有未配对的尖括号，所有符号合法。 -->
<script>
/* 主题 v6.1 页脚：列表页生成文章列表目录 / 详情页生成文章目录 / 滚动高亮 */
(function () {
  'use strict';

  function mk(tag, cls, text) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text != null) d.textContent = text;
    return d;
  }

  function makePanel(title, extra) {
    var panel = mk('div', 'qb-panel');
    var hd = mk('div', 'qb-panel-hd');
    hd.appendChild(mk('span', 'qb-panel-title', title));
    if (extra) hd.appendChild(mk('span', 'qb-count', extra));
    panel.appendChild(hd);
    return panel;
  }

  /* 1. 详情页：正文标题 -> 文章目录 */
  function buildToc(body, left) {
    var heads = [].slice.call(body.querySelectorAll('h1, h2, h3, h4')).filter(function (h) {
      var t = (h.textContent || '').trim();
      return t.length > 1 && h.offsetParent !== null;
    });
    if (!(heads.length > 1)) return false;

    var panel = makePanel('文章目录', heads.length + ' 节');
    var list = mk('ul', 'qb-toc-list');

    heads.forEach(function (h, i) {
      if (!h.id) h.id = 'qb-h-' + i;
      var lv = h.tagName === 'H1' ? 2 : (h.tagName === 'H2' ? 2 : (h.tagName === 'H3' ? 3 : 4));
      var li = mk('li', 'qb-lv' + lv);
      var a = mk('a');
      a.href = '#' + h.id;
      a.title = (h.textContent || '').trim();
      a.textContent = (h.textContent || '').trim();
      a.setAttribute('data-t', h.id);
      li.appendChild(a);
      list.appendChild(li);
    });
    panel.appendChild(list);
    left.insertBefore(panel, left.firstChild);

    list.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      var t = document.getElementById(a.getAttribute('data-t'));
      if (!t) return;
      e.preventDefault();
      window.scrollTo({ top: t.getBoundingClientRect().top + window.pageYOffset - 72, behavior: 'smooth' });
      history.replaceState(null, '', a.getAttribute('href'));
    });

    var links = [].slice.call(list.querySelectorAll('a'));
    var byId = {};
    links.forEach(function (a) { byId[a.getAttribute('data-t')] = a; });
    var box = left;
    var lock = false;

    function spy() {
      lock = false;
      var line = 120, cur = links[0];
      heads.forEach(function (h) {
        if (line >= h.getBoundingClientRect().top) cur = byId[h.id];
      });
      if (window.innerHeight + window.pageYOffset >= document.body.scrollHeight - 60) {
        cur = links[links.length - 1];
      }
      links.forEach(function (a) {
        if (a === cur) { a.classList.add('on'); } else { a.classList.remove('on'); }
      });
      if (cur && (box.scrollTop > cur.offsetTop ||
          cur.offsetTop > box.scrollTop + box.clientHeight - 40)) {
        box.scrollTo({ top: cur.offsetTop - box.clientHeight / 2, behavior: 'smooth' });
      }
    }
    window.addEventListener('scroll', function () {
      if (lock) return;
      lock = true;
      requestAnimationFrame(spy);
    }, { passive: true });
    spy();
    return true;
  }

  /* 2. 列表页：逐篇文章 -> 文章列表目录
     注意：一个 .day 是「一天」的分组，里面可能有多篇文章，
     所以要遍历 .postTitle a，而不是 .day。
     （首页、Tag 页、分类页、归档页几乎没有全部文章） */
  function buildPostList(left) {
    var posts = [].slice.call(document.querySelectorAll('#mainContent .day .postTitle a'));
    if (!posts.length) {
      /* 归档页：.entrylistItemTitle a，如 .day .postTitle a */
      posts = [].slice.call(document.querySelectorAll('#mainContent .entrylistItemTitle a'));
    }
    if (!posts.length) return false;

    var panel = makePanel('文章列表', '');
    var list = mk('ul', 'qb-toc-list');

    posts.forEach(function (src) {
      var txt = (src.textContent || '').replace(/\[\s*置顶\s*\]/g, '').replace(/\s+/g, ' ').trim();
      if (!txt) return;
      var li = mk('li', 'qb-lv2');
      var a = mk('a');
      a.href = src.href;
      a.textContent = txt;
      a.title = txt;
      var day = src.closest ? src.closest('.day') : null;
      var dt = day ? day.querySelector('.dayTitle') : null;
      if (dt) a.title = (dt.textContent || '').replace(/\s+/g, ' ').trim() + ' · ' + txt;
      li.appendChild(a);
      list.appendChild(li);
    });

    if (!list.children.length) return false;
    panel.appendChild(list);

    /* 27 篇以上时太占高度，给列表一个上限，内部滚动 */
    var n = list.children.length;
    list.style.maxHeight = 'calc(100vh - 220px)';
    list.style.overflowY = 'auto';
    list.style.overscrollBehavior = 'contain';
    panel.children[0].appendChild(mk('span', 'qb-count', n + ' 篇'));

    left.insertBefore(panel, left.firstChild);
    return true;
  }

  /* 3. 侧栏下方的常用链接 / 随笔档案 / 搜索 / 排行 -> 右栏公告下方 */
  function moveSideWidgets() {
    var home = document.getElementById('sideBarMain') || document.getElementById('sideBar');
    if (!home) return;
    var news = document.getElementById('sidebar_news');

    var right = document.getElementById('qb-right');
    if (!right) {
      right = mk('div', 'qb-right');
      right.id = 'qb-right';
      if (news && news.parentNode === home) home.insertBefore(right, news);
      else home.appendChild(right);
    }
    if (news && news.parentNode !== right) right.appendChild(news);

    var side = document.getElementById('blog-sidecolumn');
    if (side && side.parentNode !== right) right.appendChild(side);
  }

  /* 4. 正文图片懒加载：前两张留在首屏，其余延后，减少首屏并发 */
  function lazyImages() {
    var imgs = [].slice.call(document.querySelectorAll('#cnblogs_post_body img'));
    imgs.forEach(function (img, i) {
      if (!(i > 1)) return;
      if (!img.getAttribute('loading')) img.setAttribute('loading', 'lazy');
      img.setAttribute('decoding', 'async');
    });
  }

  /* 5. 顶栏当前项高亮 */
  function markNav() {
    var links = document.querySelectorAll('.qb-links a');
    if (!links.length) return;
    var here = location.href.replace(/[?#].*$/, '').replace(/\/$/, '');
    links.forEach(function (a) {
      var t = a.href.replace(/[?#].*$/, '').replace(/\/$/, '');
      if (t === here) { a.classList.add('on'); } else { a.classList.remove('on'); }
    });
  }

  function boot() {
    var left = document.getElementById('leftcontentcontainer');
    var body = document.getElementById('cnblogs_post_body');

    if (left) {
      var done = false;
      if (body) { done = buildToc(body, left); }
      if (!done) { buildPostList(left); }
      var cat = document.getElementById('sidebar_categories');
      if (cat) cat.classList.add('qb-secondary');
    }
    moveSideWidgets();
    lazyImages();
    markNav();

    /* 博客园侧栏是异步加载的，加载完可能重排节点，这里兜底复位一次 */
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      moveSideWidgets();
      if (tries > 12) clearInterval(timer);
    }, 500);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
