<!-- 主题 v6.0 页首 HTML
     位置：博客园后台 → 设置 → 页首 HTML 代码
     说明：
     1. 本段只放结构，样式全在「页面定制 CSS 代码」字段里。
     2. 增删菜单：复制或删除一行 a 标签即可。
     3. 当前页高亮：给对应 a 标签加 class="on"。
     4. 注意：博客园的 HTML 校验器不跳过注释与脚本，
        所以本文件内除真实标签外，不得出现任何未配对的尖括号。
-->

<!-- 提前与静态资源域名握手：这几个域名实测 0.15~0.3 秒，预热后子资源可并行加载 -->
<link rel="preconnect" href="https://assets.cnblogs.com" />
<link rel="preconnect" href="https://cdn-www.cnblogs.com" />
<link rel="preconnect" href="https://img2023.cnblogs.com" />
<link rel="preconnect" href="https://pic.cnblogs.com" />
<link rel="dns-prefetch" href="https://assets.cnblogs.com" />
<link rel="dns-prefetch" href="https://cdn-www.cnblogs.com" />
<link rel="dns-prefetch" href="https://img2023.cnblogs.com" />
<link rel="dns-prefetch" href="https://pic.cnblogs.com" />

<!-- 博客 icon（收藏夹图标）：把 href 换成你自己的图标地址（png / ico / svg / jpeg 都行）。
     这段会被博客园放进 body，浏览器不认；页脚脚本会自动把它搬进 <head> 并清掉园方默认图标。 -->
<link rel="icon" href="https://images.cnblogs.com/cnblogs_com/blogs/477677/galleries/1560097/t_261107101943_blog-icon.jpeg" />

<div class="qb-nav">
  <div class="qb-nav-inner">
    <!-- 品牌区：logo + 文字
         内置 logo 是矢量 SVG，颜色跟随明暗模式自动变，不占额外请求。
         想换成自己的图片，把下面整个 <span class="qb-logo">…</span> 换成：
         <span class="qb-logo"><img src="https://你的图床/logo.png" alt="Ep流苏" /></span>
         尺寸由 CSS 的 .qb-logo 控制（默认 26px），图片建议正方形、带透明通道的 PNG/SVG。 -->
    <a class="qb-brand" href="https://www.cnblogs.com/zhangshuaiyin/">
      <span class="qb-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="currentColor" stroke-width="7.4" stroke-linecap="round">
            <path d="M9.8 9.8 L22.2 22.2" />
            <path d="M22.2 9.8 L9.8 22.2" />
          </g>
          <circle class="qb-logo-dot" cx="4.9" cy="27.1" r="3.1" />
        </svg>
      </span>
      <span class="qb-brand-text">Ep流苏</span>
    </a>

    <nav class="qb-links">
