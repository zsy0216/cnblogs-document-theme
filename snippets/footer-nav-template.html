<!-- ============================================================
     流苏主题 v5.2 · 页脚 HTML 代码模板
     ============================================================
     粘贴位置：博客园 -> 管理 -> 设置 -> 博客设置 -> 页脚 HTML 代码
     注意：
       1. 必须先申请「JS 权限」（设置页最下方有链接），否则 script 不执行
       2. 修改后 Ctrl+F5 强制刷新
       3. 增删菜单项只需改 HTML，不需要动 JS
       4. 顶栏导航是纯 HTML 实现，适用所有页面
     ============================================================ -->

<!-- ======= 1. 顶部导航条（仿 流苏） ======= -->
<!-- 使用说明（都在本 div 内操作）：
     - 加菜单项：复制一行 `<li><a href="链接地址">显示文字</a></li>` 插入
     - 删菜单项：删除整行 `<li>...</li>`
     - 菜单链接：带 `data-nav="home"` / `data-nav="contact"` / `data-nav="rss"` 的三项
                 由 JS 自动填入真实地址（无需手动改，但建议手动指定）
     - 隐藏统计数字：删除下面 `nav-stats` 整块
     - 隐藏导航条：删除整个 `custom-top-nav` div
-->
<div class="custom-top-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <div class="site-name" id="siteName">Ep流苏</div>
            <ul class="nav-links">
                <!-- 菜单项 ← 从这里开始增删，一行一个菜单项 -->
                <li><a data-nav="home" href="https://www.cnblogs.com/zhangshuaiyin/">首页</a></li>
                <li><a href="https://i.cnblogs.com/posts/edit">新随��</a></li>
                <li><a data-nav="contact" href="mailto:your.email@example.com">联系</a></li>
                <li><a data-nav="rss" href="https://www.cnblogs.com/zhangshuaiyin/rss/">订阅</a></li>
                <li><a href="https://github.com/zsy0216">GitHub</a></li>
                <li><a href="https://i.cnblogs.com/">管理</a></li>
                <!-- 加菜单项：复制上面这一行，改 href 和文字即可 -->
            </ul>
        </div>
        <div class="nav-right" id="navStats">
            <span id="navPost">随笔 - -</span>
            <span id="navArticle">文章 - -</span>
            <span id="navComment">评论 - -</span>
            <span id="navView">阅读 - -</span>
        </div>
    </div>
</div>

<!-- ======= 2. 博客标题（登录后会识别） ======= -->
<div id="blogTitle" style="display:none;visibility:hidden;position:absolute;">
    <h1 id="Header1_HeaderTitle"></h1>
</div>

<!-- ======= 3. CSS 样式（页面定制 CSS 已包含全局样式，这里是局部增强） ======= -->
<style>
/* 确保导航条阴影足够覆盖背景 */
.custom-top-nav {
    background: #ffffff !important;
    border-bottom: 1px solid #eef0f2 !important;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03) !important;
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    z-index: 1000 !important;
}
.custom-top-nav .nav-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    padding: 0 20px;
}
.custom-top-nav .nav-left .site-name {
    color: #1f2329;
    font-weight: 600;
    font-size: 18px;
}
.custom-top-nav .nav-links li a {
    color: #4a5568;
    font-size: 15px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    transition: color .25s;
    text-decoration: none;
}
.custom-top-nav .nav-links li a:hover {
    color: #d05ce8;
    background: rgba(208, 92, 232, 0.08);
}
.custom-top-nav .nav-links li a.current {
    color: #d05ce8 !important;
    font-weight: 600;
    background: rgba(208, 92, 232, 0.08) !important;
}
.custom-top-nav .nav-right a {
    color: #a0aec0;
    font-size: 13px;
    text-decoration: none;
}
.custom-top-nav .nav-right a:hover {
    color: #d05ce8;
}
</style>

<!-- ======= 4. 功能脚本 ======= -->
<script>
(function () {
    'use strict';

    /* ============================================================
       0. 核心配置
       ============================================================ */

    /* ============================================================
       1. 导航统计数字同步
       ============================================================ */
    function syncStats() {
        var stats = document.getElementById('navStats');
        if (!stats) return;
        [
            ['stats_post_count', 'navPost'],
            ['stats_article_count', 'navArticle'],
            ['stats-comment_count', 'navComment']
        ].forEach(function (p) {
            var src = document.getElementById(p[0]);
            var dst = document.getElementById(p[1]);
            if (src && dst) dst.textContent = src.textContent.trim();
        });
        var viewEl = document.getElementById('stats-total-view-count');
        var navView = document.getElementById('navView');
        if (viewEl && navView) {
            var inner = viewEl.querySelector('span[title]');
            navView.textContent = inner
                ? '阅读 - ' + inner.title.replace('总阅读数: ', '').trim()
                : viewEl.textContent.trim();
        }
    }

    /* ============================================================
       2. 导航链接：自动补全
       ============================================================ */
    function initNavLinks() {
        var m = location.pathname.match(/^\/(\w[\w\d_\-]*)(\/|$)/);
        if (!m) return;
        var user = m[1];
        var base = 'https://www.cnblogs.com/' + user;

        var titleEl = document.getElementById('Header1_HeaderTitle');
        var siteName = titleEl ? titleEl.textContent.trim() : user;

        // 更新站点名称
        var nameEl = document.getElementById('siteName');
        if (nameEl) nameEl.textContent = siteName;

        // data-nav 自动填地址
        function set(key, href) {
            var el = document.querySelector('.nav-links a[data-nav="' + key + '"]');
            if (el) el.setAttribute('href', href);
        }
        set('home', base + '/');
        set('contact', 'https://msg.cnblogs.com/send/' + encodeURIComponent(siteName));
        set('rss', base + '/rss/');

        // 标记当前页（高亮）
        var links = document.querySelectorAll('.nav-links li a');
        for (var i = 0; i < links.length; i++) {
            var a = links[i];
            var href = a.getAttribute('href');
            if (href === '#' || !href) continue;
            if (href === base + '/' || href === base) {
                a.classList.add('current');
            }
        }
    }

    /* ============================================================
       3. 左侧文章目录（仿 流苏）
       ============================================================ */
    function initCatalog() {
        var page = location.pathname;
        var m = page.match(/^\/(\w[\w\d_\-]*)(\/|$)/);
        var user = m ? m[1] : '';
        var base = 'https://www.cnblogs.com/' + user;
        var isActive = function (url) {
            if (!url) return false;
            if (url === base + '/' || url === base) return page === '/' || page === '/' + user + '/';
            return url === page || url === page.replace(/\/$/, '');
        };

        var items = [
            { text: '全部文章', url: base + '/' },
            { text: '随笔', url: base + '/default' },
            { text: '分类', url: base + '/CatalogTypeId' },
            { text: '归档', url: base + '/PostArchive.aspx' },
            { text: '联系', url: base + '/Contact' }
        ];

        // 尝试从侧边栏的默认链接获取分类
        var ml = document.querySelector('#sideBar .mylist');
        if (ml) {
            var links = ml.querySelectorAll('a');
            var custom = [];
            for (var j = 0; j < links.length; j++) {
                var link = links[j];
                var href = link.getAttribute('href');
                var text = link.textContent.trim();
                if (!href || !text) continue;
                if (href.indexOf('https://') === 0 || href.indexOf('http://') === 0) continue;
                if (href === '#') continue;
                custom.push({ text: text, url: href });
            }
            if (custom.length) {
                items = [];
                for (var c = 0; c < custom.length; c++) {
                    items.push({ text: custom[c].text, url: custom[c].url });
                }
            }
        }

        var html = [];
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            var cls = isActive(item.url) ? ' active' : '';
            html.push('<li><a class="' + cls + '" href="' + item.url + '">' + item.text + '</a></li>');
        }

        // 将目录注入左侧侧边栏
        var sideBarMain = document.getElementById('sideBarMain');
        if (sideBarMain) {
            var catalog = document.createElement('div');
            catalog.id = 'catalog';
            catalog.innerHTML = '<h3>目录</h3><ul>' + html.join('') + '</ul>';
            sideBarMain.insertBefore(catalog, sideBarMain.firstChild);
        }
    }

    /* ============================================================
       4. 搜索按钮改名
       ============================================================ */
    function initSidebar() {
        var tries = 0;
        var timer = setInterval(function () {
            var btn = document.getElementById('btnZzk');
            if (btn && btn.value !== '搜索') btn.value = '搜索';
            if (++tries > 25) clearInterval(timer);
        }, 300);
    }

    /* ============================================================
       5. RSS 订阅弹层
       ============================================================ */
    function initSubscribe() {
        var link = document.querySelector('.nav-links a[data-nav="rss"]');
        if (!link) return;
        link.removeAttribute('target');

        link.addEventListener('click', function (e) {
            e.preventDefault();
            var url = link.href;
            var mask = document.createElement('div');
            mask.className = 'qm-sub-mask';
            mask.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';
            mask.innerHTML =
                '<div class="qm-sub">' +
                  '<h4>订阅「' + (document.getElementById('Header1_HeaderTitle') || {textContent: '本站'}).textContent.trim() + '」</h4>' +
                  '<p>把下面这个地址粘贴到你的 RSS 阅读器里（Feedly、Inoreader、NetNewsWire 等）。</p>' +
                  '<div class="qm-sub-row">' +
                    '<input type="text" readonly value="' + url + '">' +
                    '<button class="qm-sub-btn" type="button">复制</button>' +
                  '</div>' +
                  '<div class="qm-sub-links">' +
                    '<a href="https://feedly.com/i/subscription/feed/' + encodeURIComponent(url) + '" target="_blank" rel="noopener">用 Feedly 订阅</a>' +
                    '<a href="#" class="qm-sub-close">关闭</a>' +
                  '</div>' +
                '</div>';

            var maskDiv = mask.querySelector('div');
            maskDiv.style.cssText = 'background:#fff;padding:24px;border-radius:12px;max-width:400px;width:90%;';

            var input = mask.querySelector('input');
            var btn = mask.querySelector('.qm-sub-btn');
            input.value = url;

            btn.addEventListener('click', function () {
                function ok() {
                    btn.textContent = '已复制';
                    btn.style.background = '#d05ce8';
                    setTimeout(function () {
                        btn.textContent = '复制';
                        btn.style.background = '';
                    }, 1600);
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(ok).catch(fallback);
                } else {
                    fallback();
                }
                function fallback() {
                    input.focus();
                    input.select();
                    try { document.execCommand('copy'); ok(); } catch (err) {}
                }
            });

            function close() {
                mask.remove();
                document.removeEventListener('keydown', onKey);
            }
            function onKey(ev) { if (ev.key === 'Escape') close(); }

            mask.addEventListener('click', function (ev) { if (ev.target === mask) close(); });
            mask.querySelector('.qm-sub-close').addEventListener('click', function (ev) {
                ev.preventDefault();
                close();
            });
            document.addEventListener('keydown', onKey);

            document.body.appendChild(mask);
            setTimeout(function () { input.focus(); input.select(); }, 60);
        });
    }

    /* ============================================================
       6. 推荐/关注按钮（localStorage 状态）
       ============================================================ */
    function initActions() {
        var key = location.pathname.replace(/\/$/, '');

        function sweep(host) {
            if (!host) return;
            [].slice.call(host.children).forEach(function (el) {
                if (el.tagName === 'SPAN' && !el.className) el.remove();
            });
        }

        function bind(el, storeKey, onText, offText) {
            if (!el) return;
            if (el.getAttribute('data-qm-bound') === '1') return;
            el.setAttribute('data-qm-bound', '1');

            var original = el.getAttribute('data-qm-orig') || el.textContent.trim();
            el.setAttribute('data-qm-orig', original);

            var storage = 'qm_' + storeKey + ':' + key;
            var on = false;
            try { on = localStorage.getItem(storage) === '1'; } catch (e) {}

            function render() {
                el.textContent = on ? onText : original;
                el.classList.toggle('qm-on', on);
                el.setAttribute('aria-pressed', on ? 'true' : 'false');
            }

            el.onclick = null;
            el.removeAttribute('onclick');

            el.addEventListener('click', function (e) {
                e.preventDefault();
                on = !on;
                try { localStorage.setItem(storage, on ? '1' : '0'); } catch (err) {}
                render();
                sweep(document.getElementById('blog_post_info'));
                sweep(document.getElementById('green_channel'));
            });

            render();
        }

        var tries = 0;
        var timer = setInterval(function () {
            var info = document.getElementById('blog_post_info');
            var channel = document.getElementById('green_channel');

            if (channel) {
                if (channel.getAttribute('data-qm-watch') !== '1') {
                    channel.setAttribute('data-qm-watch', '1');
                    sweep(channel);
                    new MutationObserver(function () { sweep(channel); })
                        .observe(channel, { childList: true });
                }
                if (info && info.getAttribute('data-qm-watch') !== '1') {
                    info.setAttribute('data-qm-watch', '1');
                    sweep(info);
                    new MutationObserver(function () { sweep(info); })
                        .observe(info, { childList: true });
                }
                bind(document.getElementById('green_channel_digg'), 'digg', '已推荐', '好文要顶');
                bind(document.getElementById('green_channel_follow'), 'follow', '已关注', '关注我');
            }

            if (++tries > 60) clearInterval(timer);
        }, 250);
    }

    /* ============================================================
       7. 启动
       ============================================================ */
    function boot() {
        syncStats();
        initNavLinks();
        initCatalog();
        initSubscribe();
        initSidebar();
        initActions();

        // 定期补统计
        var attempts = 0;
        var timer = setInterval(function () {
            syncStats();
            var stats = document.getElementById('navStats');
            if (!stats || !stats.textContent.indexOf('随笔 - -') || ++attempts > 10) clearInterval(timer);
        }, 500);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
</script>
